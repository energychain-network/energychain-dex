openapi: 3.1.0
info:
  title: EnergyChain DEX API
  version: 1.0.0
  description: |
    Read-mostly REST and WebSocket API powering the EnergyChain DEX frontend
    and third-party integrations. All numeric fields that may exceed the safe
    integer range are returned as decimal strings.
  contact:
    name: EnergyChain core
servers:
  - url: https://dex.example.com/api/v1
    description: Production
  - url: http://localhost:8081/api/v1
    description: Local

components:
  parameters:
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
    Granularity:
      in: query
      name: granularity
      schema: { type: string, enum: [1m, 5m, 15m, 1h, 4h, 1d, 1w], default: 5m }
  schemas:
    Overview:
      type: object
      required: [chain_id, pairs, tokens, volume_usd_24h, tvl_usd, trades_24h, updated_at]
      properties:
        chain_id: { type: integer }
        pairs: { type: integer }
        tokens: { type: integer }
        volume_usd_24h: { type: string, description: USD volume over the last 24h. }
        tvl_usd: { type: string }
        trades_24h: { type: integer }
        updated_at: { type: integer, format: int64 }
    Pair:
      type: object
      required: [address, token0, token1, reserve0, reserve1]
      properties:
        address: { type: string }
        token0: { type: string }
        token1: { type: string }
        symbol0: { type: string }
        symbol1: { type: string }
        reserve0: { type: string }
        reserve1: { type: string }
        volume_usd_24h: { type: string }
        fees_usd_24h: { type: string }
        tvl_usd: { type: string }
        apr_24h: { type: string }
        price0_usd: { type: string }
        price1_usd: { type: string }
        created_height: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
    Candle:
      type: object
      required: [t, o, h, l, c, v, v_usd, n]
      properties:
        t: { type: integer, format: int64, description: Unix seconds (bucket start). }
        o: { type: string } ; h: { type: string } ; l: { type: string } ; c: { type: string }
        v: { type: string, description: Token0 base-units volume. }
        v_usd: { type: string }
        n: { type: integer }
    Token:
      type: object
      required: [address, symbol, decimals]
      properties:
        address: { type: string }
        symbol: { type: string }
        name: { type: string }
        decimals: { type: integer }
        total_supply: { type: string }
        wrapped_native: { type: boolean }
        stablecoin: { type: boolean }
        trust_score: { type: integer }
        price_usd: { type: string }
        volume_usd_24h: { type: string }
    QuoteRequest:
      type: object
      required: [token_in, token_out, amount_in]
      properties:
        token_in: { type: string }
        token_out: { type: string }
        amount_in: { type: string, description: Base-units integer. }
        max_hops: { type: integer, minimum: 1, maximum: 4, default: 3 }
    Quote:
      type: object
      required: [token_in, token_out, amount_in, amount_out, path, pairs, hops, fee_bps_total]
      properties:
        token_in: { type: string }
        token_out: { type: string }
        amount_in: { type: string }
        amount_out: { type: string }
        price_impact: { type: string }
        path: { type: array, items: { type: string } }
        pairs: { type: array, items: { type: string } }
        hops: { type: integer }
        fee_bps_total: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /overview:
    get:
      summary: Aggregate DEX KPIs.
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } }
  /pairs:
    get:
      summary: List trading pairs.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: sort
          schema: { type: string, enum: [tvl, volume, apr, new], default: tvl }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Pair' } }
                  limit: { type: integer }
                  offset: { type: integer }
  /pairs/{address}:
    get:
      summary: Pair detail.
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pair' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /pairs/{address}/candles:
    get:
      summary: OHLCV candles for the pair.
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Granularity'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Candle' } }
                  granularity: { type: string }
  /pairs/{address}/swaps:
    get:
      summary: Recent swaps for the pair.
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK }
  /swaps:
    get:
      summary: Recent swaps across all pairs.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK }
  /tokens:
    get:
      summary: List tokens with at least one liquidity pool.
      parameters: [ { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Token' } }
  /tokens/{address}:
    get:
      summary: Token detail.
      parameters: [ { in: path, name: address, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        '404': { description: Not found }
  /quote:
    post:
      summary: Server-side multi-hop swap quote.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        '404': { description: No route found }
  /portfolio/{owner}:
    get:
      summary: LP positions and trade history for an address.
      parameters: [ { in: path, name: owner, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK }
  /search:
    get:
      summary: Cross-entity search (tokens / pairs / tx hashes).
      parameters: [ { in: query, name: q, required: true, schema: { type: string, minLength: 2 } } ]
      responses:
        '200': { description: OK }

  # =========================================================================
  # Native Cosmos modules (资产发行 / 交易 / 结算 / 合规 / 能源)
  # All numeric on-chain values are decimal strings. Enums are proto names.
  # =========================================================================
  /native/config:
    get:
      summary: Chain connection params for Keplr/CosmJS (chain id, bech32 prefix, denom).
      responses: { '200': { description: OK } }
  /denoms:
    get:
      summary: List stableusd settlement denoms.
      responses: { '200': { description: OK } }
  /denoms/{id}:
    get:
      summary: Stable denom detail.
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /denoms/{id}/balance/{addr}:
    get:
      summary: Authoritative on-chain free balance for an account (live query).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses: { '200': { description: OK }, '502': { description: Upstream chain error } }
  /rwa/tokens:
    get: { summary: List RWA security tokens., responses: { '200': { description: OK } } }
  /rwa/tokens/{id}:
    get:
      summary: RWA token detail.
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /rwa/tokens/{id}/distributions:
    get:
      summary: Dividend/return distributions for a token.
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK } }
  /rwa/tokens/{id}/redemptions:
    get:
      summary: Redemption requests for a token.
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK } }
  /markets:
    get: { summary: List order-book (FBA) markets., responses: { '200': { description: OK } } }
  /markets/{id}:
    get:
      summary: Market detail.
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /markets/{id}/orderbook:
    get:
      summary: Aggregated bid/ask depth from open orders.
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK } }
  /markets/{id}/trades:
    get:
      summary: Recent uniform-price batch clears for a market.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: OK } }
  /markets/{id}/candles:
    get:
      summary: OHLCV candles aggregated from batch clears.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Granularity'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: OK } }
  /orders/{addr}:
    get:
      summary: Open orders for an owner across markets.
      parameters: [ { in: path, name: addr, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }
  /mincast/markets:
    get: { summary: List bonding-curve (mincast) markets., responses: { '200': { description: OK } } }
  /mincast/markets/{id}:
    get:
      summary: Mincast market detail.
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /mincast/markets/{id}/quote:
    get:
      summary: Live mint/melt preview against the bonding curve.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: is_mint, schema: { type: boolean, default: true } }
        - { in: query, name: amount, required: true, schema: { type: string } }
      responses: { '200': { description: OK }, '502': { description: Upstream chain error } }
  /mincast/markets/{id}/trades:
    get:
      summary: Recent mint/melt trades for a market.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: OK } }
  /offerings:
    get: { summary: List RWA initial offerings (IRO)., responses: { '200': { description: OK } } }
  /offerings/{id}:
    get:
      summary: Offering detail with subscriptions.
      parameters: [ { in: path, name: id, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /identity/accounts/{addr}:
    get:
      summary: KYC / accreditation status for an address.
      parameters: [ { in: path, name: addr, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }
  /policies/{id}:
    get:
      summary: Compliance policy detail.
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
  /identity/evaluate:
    post:
      summary: Live compliance pre-check for a transfer (EvaluateTransfer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_id, from, to, amount]
              properties:
                policy_id: { type: string }
                from: { type: string }
                to: { type: string }
                amount: { type: string }
      responses: { '200': { description: OK }, '502': { description: Upstream chain error } }
  /assethub/devices:
    get: { summary: List metering devices., responses: { '200': { description: OK } } }
  /assethub/devices/{id}/readings:
    get:
      summary: Recent readings for a device.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: OK } }
  /assethub/providers:
    get: { summary: List bonded data providers., responses: { '200': { description: OK } } }
  /assethub/topics:
    get: { summary: List oracle aggregation topics., responses: { '200': { description: OK } } }
  /native/portfolio/{addr}:
    get:
      summary: Cross-module portfolio for a bech32 address (balances, orders, invests, subscriptions).
      parameters: [ { in: path, name: addr, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }
  /tx/simulate:
    post:
      summary: Proxy to cosmos.tx Simulate (browser signs, server forwards).
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: OK }, '502': { description: Upstream chain error } }
  /tx/broadcast:
    post:
      summary: Proxy to cosmos.tx BroadcastTx.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: OK }, '502': { description: Upstream chain error } }
